name: Build Tauri App

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # Linux x64
          - name: Linux
            platform: ubuntu-22.04
            args: ""

          # Windows x64
          - name: Windows
            platform: windows-latest
            args: ""

          # macOS Apple Silicon
          - name: macOS ARM64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"

          # macOS Intel
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # ─────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Node
      # ─────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ─────────────────────────────────────────
      # Rust
      # ─────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ─────────────────────────────────────────
      # Linux dependencies
      # ─────────────────────────────────────────

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # ─────────────────────────────────────────
      # Frontend dependencies
      # ─────────────────────────────────────────

      - name: Install frontend dependencies
        run: npm ci

      # ─────────────────────────────────────────
      # Build Tauri app
      # ─────────────────────────────────────────

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}

          # Upload generated bundles as workflow artifacts.
          # We intentionally do NOT give tauri-action tagName/releaseName,
          # so it does not try to create/upload a GitHub Release itself.
          uploadWorkflowArtifacts: true

          workflowArtifactNamePattern: "${{ matrix.name }}-[bundle]"

  # ─────────────────────────────────────────────
  # GitHub Release
  # ─────────────────────────────────────────────

  release:
    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show release files
        run: |
          echo "===== Release files ====="
          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vortex JSON Viewer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/**/*.AppImage
            release/**/*.msi
            release/**/*.exe
            release/**/*.dmg