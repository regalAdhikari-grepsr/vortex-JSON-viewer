name: Build Tauri App

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ─────────────────────────────────────
          # Linux x64
          # ─────────────────────────────────────

          - name: Linux
            platform: ubuntu-22.04
            target: ""
            bundle: appimage

          # ─────────────────────────────────────
          # Windows x64
          # ─────────────────────────────────────

          - name: Windows
            platform: windows-latest
            target: ""
            bundle: msi,nsis

          # ─────────────────────────────────────
          # macOS Apple Silicon
          # ─────────────────────────────────────

          - name: macOS-ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg

          # ─────────────────────────────────────
          # macOS Intel
          # ─────────────────────────────────────

          - name: macOS-Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg

    runs-on: ${{ matrix.platform }}

    steps:

      # ─────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Node
      # ─────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # ─────────────────────────────────────────
      # Rust
      # ─────────────────────────────────────────

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ─────────────────────────────────────────
      # Linux dependencies
      # ─────────────────────────────────────────

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            squashfs-tools \
            libfuse2

      # ─────────────────────────────────────────
      # Frontend dependencies
      # ─────────────────────────────────────────

      - name: Install frontend dependencies
        run: npm ci

      # ─────────────────────────────────────────
      # Build Linux
      # ─────────────────────────────────────────

      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          npx tauri build --bundles appimage

      # ─────────────────────────────────────────
      # Fix Linux AppImage
      # ─────────────────────────────────────────

      - name: Fix Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euxo pipefail

          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"

          APPIMAGE=$(find "$APPIMAGE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.AppImage" \
            -print -quit)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: AppImage not found"
            exit 1
          fi

          echo "Found AppImage:"
          echo "$APPIMAGE"

          rm -rf AppDir squashfs-root

          "$APPIMAGE" --appimage-extract

          mv squashfs-root AppDir

          echo ""
          echo "===== Bundled Wayland libraries ====="

          find AppDir/usr/lib \
            -maxdepth 1 \
            -type f \
            -name "libwayland-*" \
            -print || true

          echo ""
          echo "Removing bundled libwayland-client.so.0..."

          rm -f AppDir/usr/lib/libwayland-client.so.0

          if [ -e AppDir/usr/lib/libwayland-client.so.0 ]; then
            echo "ERROR: libwayland-client.so.0 still exists"
            exit 1
          fi

          echo "libwayland-client.so.0 successfully removed."

          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          rm -f "$APPIMAGE"

          ARCH=x86_64 \
            ./appimagetool \
            AppDir \
            "$APPIMAGE"

          chmod +x "$APPIMAGE"

          echo ""
          echo "===== Final AppImage ====="

          ls -lh "$APPIMAGE"

          rm -rf squashfs-root

      # ─────────────────────────────────────────
      # Build Windows
      # ─────────────────────────────────────────

      - name: Build Windows
        if: matrix.platform == 'windows-latest'
        run: |
          npx tauri build --bundles msi,nsis

      # ─────────────────────────────────────────
      # Build macOS
      # ─────────────────────────────────────────

      - name: Build macOS
        if: matrix.platform == 'macos-latest'
        run: |
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles dmg

      # ─────────────────────────────────────────
      # Show build files
      # ─────────────────────────────────────────

      - name: Show build output
        shell: bash
        run: |
          echo "===== BUILD OUTPUT ====="
          find src-tauri/target -type f \
            \( -name "*.AppImage" \
            -o -name "*.msi" \
            -o -name "*.exe" \
            -o -name "*.dmg" \) \
            -print

      # ─────────────────────────────────────────
      # Upload Linux
      # ─────────────────────────────────────────

      - name: Upload Linux artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # ─────────────────────────────────────────
      # Upload Windows
      # ─────────────────────────────────────────

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # ─────────────────────────────────────────
      # Upload macOS
      # ─────────────────────────────────────────

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # GitHub Release
  # ─────────────────────────────────────────────

  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs: build

    runs-on: ubuntu-24.04

    steps:

      # ─────────────────────────────────────────
      # Download Linux
      # ─────────────────────────────────────────

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vortex-linux
          path: release/linux

      # ─────────────────────────────────────────
      # Download Windows
      # ─────────────────────────────────────────

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vortex-windows
          path: release/windows

      # ─────────────────────────────────────────
      # Download macOS ARM64
      # ─────────────────────────────────────────

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vortex-macOS-ARM64
          path: release/macos-arm64

      # ─────────────────────────────────────────
      # Download macOS Intel
      # ─────────────────────────────────────────

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: vortex-macOS-Intel
          path: release/macos-intel

      # ─────────────────────────────────────────
      # Show release files
      # ─────────────────────────────────────────

      - name: Show release files
        run: |
          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          find release -type f -print

          echo ""
          echo "========================================"
          echo "FILE COUNT"
          echo "========================================"

          find release -type f | wc -l

      # ─────────────────────────────────────────
      # Create GitHub Release
      # ─────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vortex JSON Viewer ${{ github.ref_name }}
          generate_release_notes: true

          files: |
            release/linux/*.AppImage
            release/windows/*.msi
            release/windows/*.exe
            release/macos-arm64/*.dmg
            release/macos-intel/*.dmg