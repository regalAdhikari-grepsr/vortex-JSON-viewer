name: Build Tauri App

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4

      - name: Build Tauri AppImage
        run: cargo tauri build --bundles appimage

      - name: Remove incompatible bundled Wayland libraries
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/vortex-JSON-viewer.AppDir"

          rm -f "$APPDIR/usr/lib/libwayland-client.so.0"
          rm -f "$APPDIR/usr/lib/libwayland-cursor.so.0"
          rm -f "$APPDIR/usr/lib/libwayland-egl.so.1"
          rm -f "$APPDIR/usr/lib/libwayland-server.so.0"

      - name: Install linuxdeploy
        run: |
          wget -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Rebuild AppImage
        run: |
          APPDIR="src-tauri/target/release/bundle/appimage/vortex-JSON-viewer.AppDir"

          rm -f src-tauri/target/release/bundle/appimage/*.AppImage

          NO_STRIP=1 \
          ./linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir "$APPDIR" \
            --output appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage


  # ─────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4

      - name: Build Windows
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe


  # ─────────────────────────────────────────────
  # macOS
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4

      - name: Build macOS
        run: cargo tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app


  # ─────────────────────────────────────────────
  # GitHub Release
  # ─────────────────────────────────────────────
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build-linux
      - build-windows
      - build-macos

    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.head_commit.id }}
          name: Release ${{ github.event.head_commit.message }}
          generate_release_notes: true
          files: |
            release/vortex-linux/*.AppImage
            release/vortex-windows/*.msi
            release/vortex-windows/*.exe
            release/vortex-macos/*.dmg